<style>
.lx-tilt{position:relative;transform-style:preserve-3d;transition:transform .2s ease-out;will-change:transform}
.lx-tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px at var(--lx-mx,50%) var(--lx-my,50%), rgba(255,255,255,0.12), transparent 65%);opacity:0;transition:opacity .3s ease;pointer-events:none}
.lx-tilt:hover::after{opacity:1}
</style>
<div style="perspective:1200px">
  <div class="lx-tilt" style="max-width:24rem;border-radius:16px;border:1px solid rgba(255,255,255,0.1);background:#141b2e;padding:32px;box-shadow:0 12px 32px -4px rgba(0,0,0,0.19), 0 6px 16px -2px rgba(0,0,0,0.34), 0 1px 2px rgba(0,0,0,0.14)">
    <p style="margin:0;font:500 12px/1 Manrope, 'Segoe UI', system-ui, sans-serif;text-transform:uppercase;letter-spacing:.18em;color:#f0b35b">Dimension</p>
    <h3 style="margin:12px 0 0;font:400 26px/1.15 Fraunces, Georgia, serif;color:#f3f4f8">It follows the light</h3>
    <p style="margin:12px 0 0;font:400 15px/1.6 Manrope, 'Segoe UI', system-ui, sans-serif;color:#9aa3b8">Tilt tracks the cursor; the sheen is a specular highlight riding the same position.</p>
  </div>
</div>
<script>
(function(){
  if(!matchMedia('(pointer:fine)').matches||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.lx-tilt').forEach(function(el){
    el.addEventListener('mousemove',function(e){
      var b=el.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;
      el.style.transform='rotateX('+((0.5-py)*12.8).toFixed(2)+'deg) rotateY('+((px-0.5)*12.8).toFixed(2)+'deg) translateZ(8px)';
      el.style.setProperty('--lx-mx',(px*100).toFixed(1)+'%');
      el.style.setProperty('--lx-my',(py*100).toFixed(1)+'%');
    });
    el.addEventListener('mouseleave',function(){el.style.transform='';});
  });
})();
</script>
